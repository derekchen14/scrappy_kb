version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scrappy_kb_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrappy_kb}
      POSTGRES_USER: ${POSTGRES_USER:-scrappy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrappy_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrappy_user} -d ${POSTGRES_DB:-scrappy_kb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scrappy_kb_app
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-scrappy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrappy_password}
      POSTGRES_DB: ${POSTGRES_DB:-scrappy_kb}
      POSTGRES_PORT: 5432
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-aj7n76ab551kb76m.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-http://localhost:8080}
      AUTH0_ALGORITHMS: ${AUTH0_ALGORITHMS:-RS256}
      PORT: ${APP_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port ${APP_PORT:-8080} --reload"

volumes:
  postgres_data:
  uploads_data:

